[project]
name = "ticketdesk"
version = "0.1.0"
description = "System for receiving and processing internal support requests."
readme = "README.md"
authors = [
    { name = "VinhNguyenUTE", email = "valtriek99@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.2",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "django-stubs>=6.1.2",
    "djangorestframework-stubs>=3.18.2",
    "factory-boy>=3.3.3",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-q"

[tool.coverage.run]
omit = [
    "*/migrations/*",
    "*/management/*",
    "*/tests/*",
    "*/tests.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 70

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
check_untyped_defs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disable_error_code = ["var-annotated", "attr-defined", "return-value", "operator"]
exclude = [
    "migrations",
    "management",
    "tests",
]



[tool.django-stubs]
django_settings_module = "config.settings.test"




[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "**/migrations/*",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"config/settings/*" = ["F403", "F405"]
"**/migrations/*" = ["ALL"]

